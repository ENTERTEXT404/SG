name: CIDRCN

on:
  schedule:
    - cron: '30 0 * * *' # 08:30 Asia/Shanghai
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: sg-rule-publish-${{ github.ref }}
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Generate CIDRCN rules
        run: python3 scripts/sync_cidrcn.py
      - name: Commit and push CIDRCN changes
        run: |
          git add -- RULE-SET/CIDRCN.list
          if git diff --cached --quiet -- RULE-SET/CIDRCN.list; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync CIDRCN rules'
          git push origin HEAD:refs/heads/main
