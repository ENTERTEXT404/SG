name: AT

on:
  schedule:
    - cron: '30 8 * * *'
      timezone: Asia/Shanghai
    - cron: '45 8 * * *' # CIDRCN retry if the primary run is delayed or fails
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      publish:
        description: Write and push GLOBAI.list and CIDRCN.list
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sg-rule-publish-${{ github.ref }}
  queue: max

jobs:
  preview:
    if: >-
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preview GLOBAI sync
        shell: bash
        run: &sync_globai |
          set --
          if [[ "${GLOBAI_SYNC_MODE:-preview}" == "publish" ]]; then
            set -- --write
          fi
          python3 - "$@" <<'PYTHON'
          """Validate MagicRule GlobalAI for Surge and optionally update the SG mirror."""
          import argparse
          from collections import Counter
          from difflib import unified_diff
          from hashlib import sha256
          import ipaddress
          import json
          from pathlib import Path
          import re
          import sys
          from tempfile import NamedTemporaryFile
          from urllib.request import HTTPRedirectHandler, Request, build_opener


          ORIGIN = "https://magicrule.pages.dev"
          INDEX_URL = f"{ORIGIN}/data/index/Surge.json"
          RULE_ID = "24dbbb36-e5c5-4800-8fde-4af469213846"
          ROOT = Path.cwd().resolve()
          TARGET = ROOT / "RULE-SET/GLOBAI.list"
          HOST_TYPES = ("DOMAIN", "DOMAIN-SUFFIX")
          IP_TYPES = ("IP-CIDR", "IP-CIDR6", "IP-ASN")
          RULE_TYPES = (*HOST_TYPES, "DOMAIN-KEYWORD", "URL-REGEX", *IP_TYPES, "PROCESS-NAME")
          LABEL = r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?"
          HOSTNAME = re.compile(rf"{LABEL}(?:\.{LABEL})+")
          REVIEWED_URL_REGEX = r"https://www\.google\.com/.*continue=https://gemini\.google\.com.+"
          EXPECTED_PROVIDERS = {
              "https://github.com/v2fly/domain-list-community",
              "https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/refs/heads/main/rules/surge/all.list",
              "https://ruleset.skk.moe/List/non_ip/ai.conf",
          }
          MAX_RESPONSE_BYTES = 8 * 1024 * 1024


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def fetch(url):
              request = Request(url, headers={"User-Agent": "SG-GlobalAI-Sync/1"})
              with build_opener(NoRedirect).open(request, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError(f"Expected HTTP 200, received {response.status}")
                  data = response.read(MAX_RESPONSE_BYTES + 1)
              if len(data) > MAX_RESPONSE_BYTES:
                  raise ValueError("Upstream response exceeds the size limit")
              return data


          def select_one(items, **fields):
              matches = [item for item in items
                         if all(item.get(k) == v for k, v in fields.items())]
              if len(matches) != 1:
                  raise ValueError("Could not identify exactly one GlobalAI resource")
              return matches[0]


          def magicrule_url(url, path_pattern):
              if not re.fullmatch(re.escape(ORIGIN) + path_pattern, url):
                  raise ValueError("Unexpected MagicRule resource URL")
              return url


          def read_source():
              index = json.loads(fetch(INDEX_URL))
              if index["client"] != "Surge":
                  raise ValueError("Expected the Surge index")
              row = select_one(index["rules"], id=RULE_ID, name="GlobalAI")
              url = magicrule_url(row["manifest"], r"/data/rules/Surge/[0-9a-f]+/manifest\.json")
              manifest = json.loads(fetch(url))
              if manifest["client"] != "Surge" or manifest["rule"] != "GlobalAI":
                  raise ValueError("Expected the Surge GlobalAI manifest")
              if set(row["providers"]) != EXPECTED_PROVIDERS or set(manifest["providers"]) != EXPECTED_PROVIDERS:
                  raise ValueError("Upstream provider list changed. Review provenance before updating.")
              for field in ("rule_updated_at", "type_counts", "total_line_count"):
                  if row[field] != manifest[field]:
                      raise ValueError("Index and manifest disagree. Retry after upstream finishes publishing.")
              full = select_one(manifest["artifacts"], key="rules", role="full",
                                ext="list", empty=False, binary=False)
              url = magicrule_url(full["url"], r"/data/_shared/artifacts/GlobalAI_rules_[0-9a-f]+\.list")
              data = fetch(url)
              if sha256(data).hexdigest() != full["dedupe"]["bytes_sha256"]:
                  raise ValueError("GlobalAI download does not match its manifest SHA-256")
              rules = parse_rules(data.decode("utf-8-sig"), "MagicRule")
              if len(rules) != manifest["total_line_count"] or Counter(r[0] for r in rules) != manifest["type_counts"]:
                  raise ValueError("GlobalAI rule counts do not match its manifest")
              return rules


          def parse_rules(text, source):
              rules = []
              for number, raw in enumerate(text.splitlines(), 1):
                  line = raw.strip(" \t")
                  if not line or line.startswith(("#", "//", ";")):
                      continue
                  try:
                      fields = [field.strip(" \t") for field in line.split(",")]
                      rules.append(parse_rule(fields))
                  except ValueError as error:
                      raise ValueError(f"{source} line {number}: {error}") from error
              if not rules:
                  raise ValueError(f"{source} has no rules")
              return rules


          def parse_rule(fields):
              kind = fields[0]
              if kind not in RULE_TYPES:
                  raise ValueError("unsupported rule type")
              if kind in IP_TYPES:
                  if len(fields) != 3 or fields[2] != "no-resolve":
                      raise ValueError("expected an IP matcher with no-resolve and no policy")
              elif len(fields) != 2:
                  raise ValueError("expected a matcher with no extra fields or policy")

              value = fields[1]
              if kind in HOST_TYPES:
                  value = value.lower()
                  if not fields[1].isascii() or len(value) > 253 or not HOSTNAME.fullmatch(value):
                      raise ValueError("invalid hostname; expected a multi-label ASCII hostname")
              elif kind == "DOMAIN-KEYWORD":
                  if not re.fullmatch(r"[A-Za-z0-9._-]+", value):
                      raise ValueError("unsupported domain keyword")
                  value = value.lower()
              elif kind == "URL-REGEX":
                  if value != REVIEWED_URL_REGEX:
                      raise ValueError("URL-REGEX changed; validate the new expression in Surge first")
              elif kind == "PROCESS-NAME":
                  if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._ -]*", value):
                      raise ValueError("unsupported process name")
              elif kind == "IP-ASN":
                  match = re.fullmatch(r"(?:AS)?([0-9]{1,10})", value, re.IGNORECASE)
                  if not match or not 1 <= int(match[1]) <= 4294967295:
                      raise ValueError("invalid ASN")
                  value = str(int(match[1]))
              else:
                  network = ipaddress.ip_network(value)
                  expected = 6 if kind == "IP-CIDR6" else 4
                  if network.version != expected or "%" in value:
                      raise ValueError("unexpected IP address family or scope")
                  value = str(network)
              return (kind, value, *fields[2:])


          def covered_by(rule, suffixes):
              kind, value, *_ = rule
              if kind not in HOST_TYPES:
                  return False
              labels = value.split(".")
              start = 1 if kind == "DOMAIN-SUFFIX" else 0
              return any(".".join(labels[i:]) in suffixes for i in range(start, len(labels)))


          def normalize(rules):
              unique = list(dict.fromkeys(rules))
              suffixes = {rule[1] for rule in unique if rule[0] == "DOMAIN-SUFFIX"}
              retained = [rule for rule in unique if not covered_by(rule, suffixes)]
              hosts = sorted((rule for rule in retained if rule[0] in HOST_TYPES),
                             key=lambda rule: (HOST_TYPES.index(rule[0]), tuple(reversed(rule[1].split(".")))))
              other = [rule for rule in retained if rule[0] not in HOST_TYPES]
              return hosts + other, len(rules) - len(unique), len(unique) - len(retained)


          def atomic_write(target, text):
              with NamedTemporaryFile(dir=target.parent, mode="w", encoding="utf-8", delete=False) as temp:
                  temporary = Path(temp.name)
                  try:
                      temp.write(text)
                      temp.close()
                      temporary.chmod(target.stat().st_mode & 0o777)
                      temporary.replace(target)
                  finally:
                      temporary.unlink(missing_ok=True)


          def sync(write, show_diff):
              old_data = TARGET.read_bytes()
              old_text = old_data.decode("utf-8-sig")
              old, _, _ = normalize(parse_rules(old_text, "Current GLOBAI.list"))
              source = read_source()
              rules, duplicates, covered = normalize(source)
              added = len(set(rules) - set(old))
              removed = len(set(old) - set(rules))
              limit = max(1, len(old) // 10)
              print(f"Upstream: {len(source)}; duplicates: {duplicates}; covered: {covered}; output: {len(rules)}")
              print(f"Compared with normalized repository rules: +{added}, -{removed}")
              candidate = "".join(",".join(rule) + "\n" for rule in rules)
              if old_data == candidate.encode("utf-8"):
                  print("GLOBAI.list is up to date.")
                  return

              if show_diff:
                  sys.stdout.writelines(unified_diff(old_text.splitlines(keepends=True),
                                                     candidate.splitlines(keepends=True),
                                                     "current/GLOBAI.list", "candidate/GLOBAI.list"))
              if max(added, removed) > limit:
                  raise ValueError(f"Rule changes exceed {limit} additions or removals; review the upstream change")
              if write:
                  atomic_write(TARGET, candidate)
                  print("Updated RULE-SET/GLOBAI.list.")
              else:
                  print("Preview complete. Candidate differs from the current file.")


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              mode = parser.add_mutually_exclusive_group()
              mode.add_argument("--write", action="store_true", help="write RULE-SET/GLOBAI.list")
              mode.add_argument("--diff", action="store_true", help="preview changes against RULE-SET/GLOBAI.list")
              args = parser.parse_args()
              try:
                  sync(args.write, args.diff)
              except (ValueError, OSError, KeyError, TypeError, AttributeError) as error:
                  print(f"GlobalAI sync failed: {error}", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON

      - name: Preview CIDRCN sync
        shell: bash
        run: &sync_cidrcn |
          target=RULE-SET/CIDRCN.list
          if [[ "${CIDRCN_SYNC_MODE:-preview}" == "preview" ]]; then
            target="$RUNNER_TEMP/CIDRCN.list"
          fi
          python3 - --output "$target" <<'PYTHON'
          """Build the Surge CIDRCN rule set from Sukka's IPv4 and IPv6 lists."""

          import argparse
          import ipaddress
          import re
          import sys
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from urllib.request import Request, urlopen


          TARGET = Path.cwd() / "RULE-SET" / "CIDRCN.list"
          SOURCES = {
              4: "https://ruleset.skk.moe/List/ip/china_ip.conf",
              6: "https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf",
          }
          RULE_TYPES = {4: "IP-CIDR", 6: "IP-CIDR6"}
          MAX_BYTES = 2 * 1024 * 1024
          MAX_CHANGE_PERCENT = 10

          # CIDRCN.list adapts Sukka's Ruleset (https://github.com/SukkaW/Surge).
          # License: CC BY-SA 2.0 (https://creativecommons.org/licenses/by-sa/2.0/).
          # Adaptation: comment and non-CIDR removal, deduplication, aggregation,
          # sorting and the exclusions below.
          # Reproduce offline with --sources IPV4 IPV6 --output /tmp/CIDRCN.list.
          #
          # Special-use and multicast references:
          # https://www.iana.org/assignments/iana-ipv4-special-registry
          # https://www.iana.org/assignments/iana-ipv6-special-registry
          # https://www.iana.org/assignments/multicast-addresses/
          # https://www.iana.org/assignments/ipv6-multicast-addresses/
          #
          # APNIC registration and RIPE RIS routes verified on 2026-11-22.
          # The listed 14.x prefixes are Vietnam VNPT (AS45899).
          # 202.92.4.0/22 is registered in Vietnam and originated by VNPT (AS135905).
          # 223.122.0.0/16, 223.123.128.0/18, 223.123.192.0/20:
          # China Mobile Hong Kong (AS9231, AS137872).
          # 223.123.0.0/17: Pakistan CMPak (AS59257, AS138423).
          # https://ftp.apnic.net/stats/apnic/delegated-apnic-latest
          # https://rdap.apnic.net/ip/14.226.104.0
          # https://stat.ripe.net/resource/AS45899
          # https://rdap.apnic.net/ip/202.92.4.0
          # https://stat.ripe.net/resource/202.92.4.0/22
          # https://stat.ripe.net/resource/223.122.0.0/15
          # Keep CMNET's 223.123.208.0/20 and 223.123.224.0/19.
          #
          # Additional IPv4 exclusions cross-checked against APNIC RDAP and RIPE RIS:
          # 117.134.192.0/18: CMPak (AS59257, AS138423), inside CMNET's 117.128.0.0/10.
          # 103.143.92.0/23 and 202.75.248.0/22: China Telecom Macau (AS136167).
          # 218.213.85.0/24 and 222.167.160.0/23: HKNet and HK Cable (AS9293, AS9908).
          # 160.187.128.0/23: Lao Communication Technology (AS153347).
          # 103.220.156.0/22: Microtel and Cityline India (AS135251, AS135746).
          # 1.18.128.0/24: Korea Internet Security Agency (AS23596).
          # Use https://rdap.apnic.net/ip/<network-address> for registration and
          # https://stat.ripe.net/resource/<prefix> for route evidence.
          # IPv6 registration for 2400:9380:8001::/48 and 2c0f:f7a8:9041::/48
          # differs from the origin network. Review location evidence before excluding.
          EXCLUSIONS = {
              4: (
                  "0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8",
                  "169.254.0.0/16", "172.16.0.0/12", "192.0.2.0/24", "192.168.0.0/16",
                  "198.18.0.0/15", "198.51.100.0/24", "203.0.113.0/24", "224.0.0.0/4",
                  "240.0.0.0/4",
                  "14.226.104.0/21", "14.226.168.0/21", "14.227.96.0/20",
                  "14.227.192.0/20", "14.241.232.0/21", "14.255.16.0/24",
                  "14.255.238.0/24", "14.255.254.0/24", "202.92.4.0/22",
                  "223.122.0.0/16", "223.123.0.0/17",
                  "223.123.128.0/18", "223.123.192.0/20",
                  "117.134.192.0/18", "103.143.92.0/23", "202.75.248.0/22",
                  "218.213.85.0/24", "222.167.160.0/23", "160.187.128.0/23",
                  "103.220.156.0/22", "1.18.128.0/24",
              ),
              6: (
                  "::/128", "::1/128", "::ffff:0:0/96", "100::/64", "2001:2::/48",
                  "2001:db8::/32", "3fff::/20", "fc00::/7", "fe80::/10", "ff00::/8",
              ),
          }
          SIZE_HEADER = re.compile(r"^#\s*Size:\s*([0-9]+)\s*$")
          COMMENT = re.compile(r"#|//|;")
          UPSTREAM_MARKER = ["DOMAIN", "7h15.ru1353t.1s.m4d3.by.5ukk4w.skk.moe"]


          def fetch(url):
              request = Request(url, headers={"User-Agent": "SG-CIDRCN-Sync/1"})
              with urlopen(request, timeout=30) as response:
                  return response.read(MAX_BYTES + 1)


          def parse_network(value, version):
              if "%" in value or not re.search(r"/[0-9]+$", value):
                  raise ValueError("expected a CIDR with a numeric prefix length")
              network = ipaddress.ip_network(value)
              if network.version != version or not network.prefixlen:
                  raise ValueError(f"expected an IPv{version} network narrower than /0")
              return network


          def parse_rules(data, version, require_size):
              if len(data) > MAX_BYTES:
                  raise ValueError("source exceeds the size limit")

              sizes = []
              valid = []
              total = 0
              for number, raw in enumerate(data.decode("utf-8-sig").splitlines(), 1):
                  if match := SIZE_HEADER.fullmatch(raw.strip()):
                      sizes.append(int(match[1]))
                  line = COMMENT.split(raw, maxsplit=1)[0].strip()
                  if not line:
                      continue
                  total += 1
                  fields = [field.strip() for field in line.split(",")]
                  if fields == UPSTREAM_MARKER:
                      continue
                  try:
                      if len(fields) == 1:
                          value = fields[0]
                      elif (fields[0] == RULE_TYPES[version] and
                            (len(fields) == 2 or fields[2:] == ["no-resolve"])):
                          # Match the published list's existing DNS behavior.
                          value = fields[1]
                      else:
                          raise ValueError("unexpected rule type, policy or option")
                      valid.append(parse_network(value, version))
                  except ValueError as error:
                      raise ValueError(f"line {number}: {error}") from error

              if (require_size or sizes) and sizes != [total]:
                  raise ValueError(f"source size header disagrees with the {total} rule lines")
              if not valid:
                  raise ValueError("source has no valid CIDRs for this address family")
              return valid, total - len(valid)


          def subtract(network, excluded):
              if not network.overlaps(excluded):
                  return (network,)
              if network.subnet_of(excluded):
                  return ()
              return network.address_exclude(excluded)


          def build_rules(data, version, require_size):
              valid, ignored = parse_rules(data, version, require_size)
              unique = set(valid)
              upstream = list(ipaddress.collapse_addresses(unique))
              networks = upstream
              for cidr in EXCLUSIONS[version]:
                  excluded = ipaddress.ip_network(cidr)
                  networks = [part for network in networks for part in subtract(network, excluded)]
              if not networks:
                  raise ValueError("no CIDRs remain after exclusions")

              result = sorted(ipaddress.collapse_addresses(networks))
              excluded_addresses = sum(net.num_addresses for net in upstream) - sum(
                  net.num_addresses for net in result
              )
              print(
                  f"IPv{version}: {len(valid)} valid, {ignored} ignored, "
                  f"{len(valid) - len(unique)} duplicates, {len(unique) - len(upstream)} "
                  f"redundant or merged, {excluded_addresses} excluded addresses, "
                  f"{len(result)} published CIDRs"
              )
              return result


          def read_baseline(path):
              all_networks = {version: [] for version in RULE_TYPES}
              versions = {kind: version for version, kind in RULE_TYPES.items()}
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  kind, _, value = line.partition(",")
                  try:
                      version = versions[kind]
                      all_networks[version].append(parse_network(value, version))
                  except (KeyError, ValueError) as error:
                      raise ValueError(f"invalid baseline rule at {path}:{number}") from error
              if any(not networks for networks in all_networks.values()):
                  raise ValueError(f"{path} must contain both address families")
              return all_networks


          def validate_change(old, new, version):
              old_count = len(old)
              new_count = len(new)
              old_size = sum(n.num_addresses for n in ipaddress.collapse_addresses(old))
              new_size = sum(n.num_addresses for n in new)
              union_size = sum(n.num_addresses for n in ipaddress.collapse_addresses(old + new))
              added = union_size - old_size
              removed = union_size - new_size
              print(f"IPv{version} vs published: {old_count} -> {new_count} CIDRs, "
                    f"+{added:,} / -{removed:,} addresses")
              if ((old_count - new_count) * 100 > old_count * MAX_CHANGE_PERCENT or
                  max(added, removed) * 100 > old_size * MAX_CHANGE_PERCENT):
                  raise ValueError(f"IPv{version} changed more than the {MAX_CHANGE_PERCENT}% "
                                   "safety limit. Review upstream before publishing")


          def write_if_changed(target, data):
              if target.exists() and target.read_bytes() == data:
                  print(f"{target.name} is up to date.")
                  return

              mode = target.stat().st_mode & 0o777 if target.exists() else 0o644
              with NamedTemporaryFile(dir=target.parent, delete=False) as temporary:
                  path = Path(temporary.name)
                  try:
                      temporary.write(data)
                      temporary.close()
                      path.chmod(mode)
                      path.replace(target)
                  finally:
                      path.unlink(missing_ok=True)
              print(f"Updated {target.name}.")


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument(
                  "--sources", nargs=2, type=Path, metavar=("IPV4", "IPV6"),
                  help="use local source snapshots in place of downloads",
              )
              parser.add_argument("--output", type=Path, default=TARGET, help="output rule-set path")
              args = parser.parse_args()

              try:
                  baseline = read_baseline(TARGET)
                  rules = []
                  for index, (version, url) in enumerate(SOURCES.items()):
                      source = args.sources[index] if args.sources else url
                      try:
                          data = source.read_bytes() if args.sources else fetch(source)
                          networks = build_rules(data, version, require_size=not args.sources)
                          validate_change(baseline[version], networks, version)
                          rules.extend(f"{RULE_TYPES[version]},{network}\n" for network in networks)
                      except (OSError, ValueError) as error:
                          raise ValueError(f"IPv{version} {source}: {error}") from error
                  write_if_changed(args.output, "".join(rules).encode("utf-8"))
              except (OSError, ValueError) as error:
                  print(f"CIDRCN sync failed: {error}", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON
          if [[ "${CIDRCN_SYNC_MODE:-preview}" == "preview" ]]; then
            if cmp -s RULE-SET/CIDRCN.list "$target"; then
              echo 'CIDRCN.list is up to date.'
            else
              echo 'CIDRCN.list would change.'
            fi
          fi

  publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event.schedule == '30 8 * * *' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate validated rule set
        shell: bash
        env:
          GLOBAI_SYNC_MODE: publish
        run: *sync_globai
      - name: Commit and push the rule set
        run: |
          git add -- RULE-SET/GLOBAI.list
          if git diff --cached --quiet -- RULE-SET/GLOBAI.list; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync GLOBAI rules'
          git push origin "HEAD:${GITHUB_REF}"

  publish-cidrcn:
    needs: publish
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Record CIDRCN start time
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            echo "### CIDRCN update"
            echo "- Trigger: ${TRIGGER} ${SCHEDULE}"
            echo "- Started: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generate CIDRCN rules
        shell: bash
        env:
          CIDRCN_SYNC_MODE: publish
        run: *sync_cidrcn
      - name: Commit and push CIDRCN changes
        run: |
          git add -- RULE-SET/CIDRCN.list
          if git diff --cached --quiet -- RULE-SET/CIDRCN.list; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync CIDRCN rules'
          git push origin HEAD:refs/heads/main
